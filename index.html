<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexxa Production Risk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F9FAFB; --surface-3:#F1F3F5;
  --line:#E2E5E9; --line-strong:#C9CED4;
  --text:#15171A; --text-2:#454B53; --text-3:#6B727B;
  --brand:#EB0A1E; --ink:#1B1D21; --ink-hover:#33363C;
  --focus:#0B63CE;
  --crit:#B0121A; --crit-bg:#FDEDEE; --crit-line:#F4C5C8;
  --high:#8F5200; --high-bg:#FFF3DF; --high-line:#F1D3A1;
  --med:#2A5AA6; --med-bg:#EAF1FB; --med-line:#C4D6F0;
  --low:#56606B; --low-bg:#EFF1F3; --low-line:#D5DADF;
  --rev:#6A3C9E; --rev-bg:#F3EDFB; --rev-line:#DCCBF0;
  --ok:#1C7443; --ok-bg:#E6F4EC; --ok-line:#B9DEC8;
  --warn:#8F5200; --warn-bg:#FFF6E6;
  --r-sm:6px; --r:8px; --r-lg:12px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.14),0 2px 6px rgba(16,24,40,.08);
  --rail:64px; --queue:360px; --drawer:440px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;min-width:1280px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- App frame ---------- */
.proto-banner{height:28px;background:#2B2E33;color:#E8EAED;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.01em}
.proto-banner b{color:#fff}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px 0 0;gap:16px;position:relative}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--brand) 0 64px,transparent 64px)}
.logo{width:var(--rail);height:56px;display:grid;place-items:center;border-right:1px solid var(--line)}
.logo-mark{width:30px;height:30px;border-radius:7px;background:var(--brand);color:#fff;font-weight:700;display:grid;place-items:center;font-size:15px;letter-spacing:-.02em}
.product{display:flex;flex-direction:column;line-height:1.15}
.product b{font-size:15px;letter-spacing:.08em}
.product span{font-size:11.5px;color:var(--text-3);letter-spacing:.02em}
.product .tm{color:var(--brand);font-weight:700;letter-spacing:.14em}
.search{margin-left:24px;flex:0 1 420px;display:flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--surface-2);color:var(--text-3)}
.search input{border:0;background:transparent;outline:0;flex:1;color:var(--text)}
.kbd{font-size:11px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text-3);background:#fff}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{width:36px;height:36px;border-radius:var(--r);border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--surface-3)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--brand);border:2px solid #fff}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:#DDE3EA;display:grid;place-items:center;font-weight:600;font-size:12px;color:#34404D;flex:none}
.user-meta{line-height:1.2}.user-meta b{font-size:13px;display:block}.user-meta span{font-size:11.5px;color:var(--text-3)}

.scopebar{height:52px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 20px 0 84px;position:sticky;top:0;z-index:20}
.scope{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;white-space:nowrap}
.scope:hover{border-color:var(--line-strong)}
.scope .k{color:var(--text-3)}
.scope b{font-weight:600}
.scope .muted{font-size:12.5px}
.vtag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:9px;font-size:11px;font-weight:600}
.vtag.ok{background:var(--ok-bg);color:var(--ok)} .vtag.old{background:var(--warn-bg);color:var(--high)}
.scope[aria-expanded=true]{border-color:var(--ink)}
.dstat{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:12.5px;font-weight:500}
.dstat i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.dstat.warn{color:var(--high);border-color:var(--high-line);background:var(--warn-bg)}
.dstat.warn i{background:var(--high)}
.dstat[aria-expanded=true]{border-color:var(--ink)}
.spop{position:fixed;z-index:50;width:340px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:14px 8px 8px}
.sp-t{font-size:14px;font-weight:600;padding:0 10px}
.sp-s{margin:2px 10px 10px;font-size:12.5px;color:var(--text-3)}
.sp-opt{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13.5px;cursor:pointer}
.sp-opt:hover{background:var(--surface-2)}
.sp-opt[aria-current=true]{background:var(--surface-3)}
.sp-opt.static{cursor:default}.sp-opt.static:hover{background:none}
.sp-opt.dis .sp-m{opacity:.55}
.sp-opt.chk input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.sp-m{flex:1;min-width:0}
.sp-m b{display:flex;align-items:center;gap:6px;font-weight:500}
.sp-m small{display:block;font-size:12px;color:var(--text-3);margin-top:1px}
.sp-m small.chg{color:var(--text-2)}
.sp-m small.warn{color:var(--high)}
.sp-n{font-size:12px;color:var(--text-3);white-space:nowrap}
.sp-chk{color:var(--ink)}
.sp-lock{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text-2);white-space:nowrap}
.sp-foot .link{white-space:nowrap}
.sp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;padding:10px 10px 4px;border-top:1px solid var(--line);font-size:12.5px;color:var(--text-3)}
.oldplan{display:flex;align-items:center;gap:10px;margin:24px 0 0;padding:10px 14px;border:1px solid var(--high-line);background:var(--warn-bg);border-radius:8px;font-size:13px;color:#5E3A00}
.oldplan span{flex:1}
.scope-sep{width:1px;height:24px;background:var(--line);margin:0 4px}
.fresh{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2);white-space:nowrap}
.fresh .srcdot{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.fresh .srcdot i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.fresh .srcdot.stale i{background:var(--high)}
.fresh .srcdot.stale{color:var(--high);font-weight:500}

.shell{display:flex;min-height:calc(100vh - 136px)}
.rail{width:var(--rail);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;position:sticky;top:52px;height:calc(100vh - 52px)}
.rail button{width:48px;height:48px;border-radius:var(--r);border:0;background:transparent;color:var(--text-3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;position:relative}
.rail button:hover{background:var(--surface-3);color:var(--text)}
.rail button.on{color:var(--text);background:var(--surface-3)}
.rail button.on::before{content:"";position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.rail .count{position:absolute;top:4px;right:4px;font-size:10px;background:var(--crit);color:#fff;border-radius:8px;padding:0 5px;line-height:16px}
.main{flex:1;min-width:0;transition:padding-right .2s}
body.drawer-open .main{padding-right:var(--drawer)}

@media (max-width:1400px){ .scope .k{display:none} .scopebar{gap:6px} #refreshBtn .rl{display:none} #refreshBtn{padding:0 8px} }
/* ---------- Primitives ---------- */
.btn{height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-hover)}
.btn-primary[disabled],.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:12.5px}
.link{background:none;border:0;padding:0;color:var(--focus);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.sev{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:600;border:1px solid;white-space:nowrap}
.sev svg{width:12px;height:12px}
.sev.critical{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.sev.high{color:var(--high);background:var(--high-bg);border-color:var(--high-line)}
.sev.medium{color:var(--med);background:var(--med-bg);border-color:var(--med-line)}
.sev.low{color:var(--low);background:var(--low-bg);border-color:var(--low-line)}
.sev.review{color:var(--rev);background:var(--rev-bg);border-color:var(--rev-line)}
.status{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px;font-size:11.5px;font-weight:500;background:var(--surface-3);color:var(--text-2);white-space:nowrap}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.status.new{background:#EEF2F7;color:#34506F}
.status.review{background:var(--med-bg);color:var(--med)}
.status.action{background:var(--high-bg);color:var(--high)}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.fail{background:var(--crit-bg);color:var(--crit)}
.status.muted{background:var(--surface-3);color:var(--text-3)}
.src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;border:1px solid var(--line);background:var(--surface-2);font-size:11px;color:var(--text-2);font-weight:500;white-space:nowrap;vertical-align:middle}
button.src:hover{border-color:var(--focus);color:var(--focus)}
.src svg{width:11px;height:11px}
.src.stale{border-color:var(--high-line);background:var(--warn-bg);color:var(--high)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;letter-spacing:-.01em}
.muted{color:var(--text-3)}
.tps{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-3);border-radius:4px;padding:1px 6px;letter-spacing:.02em}
.tps i{font-style:normal;color:var(--brand)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---------- S1 Overview (minimal) ---------- */
body.ov .main{background:#fff}
.ov-page{padding:32px 44px 0;min-height:calc(100vh - 136px);display:flex;flex-direction:column}
.ov-lower .ov-sec{align-items:flex-end}
.rank-note{margin:4px 0 0;font-size:13px;color:var(--text-3)}
.sev-legend{display:flex;gap:14px;font-size:12.5px;color:var(--text-3)}
.sev-legend span{display:inline-flex;align-items:center;gap:6px}
.ptable2{border-top:1px solid var(--line-strong)}
.p2h,.p2row{display:grid;grid-template-columns:14px minmax(0,1.5fr) 96px 150px 128px minmax(0,1fr) 124px 132px;gap:12px;align-items:center;padding:0 12px}
.p2h{height:40px;font-size:12.5px;font-weight:500;color:var(--text-3);border-bottom:1px solid var(--line)}
.p2row{width:100%;min-height:64px;padding-top:10px;padding-bottom:10px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font-size:14px;color:var(--text);position:relative}
.p2row{cursor:pointer}
.p2row:hover{background:#fff}
.p2row:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.p2row.sel{background:#fff}
.p2row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ink)}
.p2row .muted{color:var(--text-3)}
.p2row .red{color:var(--crit)}
.p2-risk{min-width:0}
.p2-risk b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.p2-risk b i{font-style:normal;color:var(--text-3);font-size:13px;margin-right:8px}
.p2-risk small{display:flex;flex-wrap:wrap;column-gap:10px;row-gap:1px;margin-top:3px;font-size:12.5px;color:var(--text-3)}
.p2-risk em{white-space:nowrap}
.p2-risk em{font-style:normal;font-weight:600}
.p2-risk em.why.red{color:var(--crit)} .p2-risk em.why.amber{color:var(--high)}
.p2-risk em.shown{color:var(--text)}
.spill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid var(--line-strong);background:#fff;color:var(--text)}
.spill.pp{border-color:var(--med-line);color:var(--med);background:var(--med-bg)}
.spill.pa{border-color:var(--high-line);color:var(--high);background:var(--high-bg)}
.spill.pm{border-color:var(--line);color:var(--text-3);background:transparent}
.p2foot{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 0;font-size:13px}
body.ov.drawer-open .main{padding-right:0}
.apt{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:#E7E9EC;color:var(--text-2);font-size:10.5px;font-weight:700;flex:none}
.apt.sm{width:16px;height:16px;font-size:9.5px}
.apt.lg{width:44px;height:44px;border-radius:10px;font-size:20px}
.src-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:-8px 0 22px}
.src-l{font-size:12.5px;color:var(--text-3);margin-right:4px}
.schip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 5px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:12.5px;color:var(--text-2)}
.schip:hover{border-color:var(--line-strong);color:var(--text)}
.schip.more{padding:0 10px}
.src-link{background:none;border:0;padding:0;font-size:12.5px;color:var(--text-2);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--line-strong)}
.src-link:hover{color:var(--text)}
.p2row .purple{color:var(--rev)}
.calc2{margin-top:2px;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px;background:#fff}
.calc2-h{font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.calc2-r{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.calc2-r.sub{border-top:1px solid var(--line);margin-top:4px;padding-top:10px}
.calc2-r.tot{border-top:2px solid var(--text);margin-top:4px;padding-top:10px}
.calc2-r.tot b{color:var(--crit)}
.calc2-r b{text-align:right;font-weight:600}
.calc2-s{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 3px;border:1px solid var(--line);border-radius:5px;background:var(--surface-2);font-size:11.5px;color:var(--text-2)}
.calc2-n{margin:10px 0 0;font-size:12px;color:var(--text-3)}
.evc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff;transition:box-shadow .2s}
.evc.hl{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.evc-h{display:flex;align-items:center;gap:8px;font-size:14px}
.evc-h b{font-weight:600}
.evc-h .fresh-b{margin-left:auto;font-size:12px}
.evc-f{display:grid;grid-template-columns:86px 1fr;gap:5px 10px;margin:10px 0;font-size:13px}
.evc-f dt{color:var(--text-3)}
.evc-f dd{margin:0}
.evc-open{background:none;border:0;padding:0;font-size:13px;font-weight:500;color:var(--text);text-decoration:underline;text-underline-offset:3px}
.evc-find{margin:0;font-size:12.5px;color:var(--text-3)}
.conn{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 136px);background:#fff}
.conn-nav{border-right:1px solid var(--line);padding:28px 16px;background:#fff}
.conn-nav h2{margin:0 8px;font-size:17px;font-weight:600}
.conn-nav p{margin:4px 8px 18px;font-size:13px;color:var(--text-3)}
.conn-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 8px;border:0;background:none;border-radius:8px;text-align:left}
.conn-row:hover{background:var(--surface-2)}
.conn-row[aria-current=true]{background:var(--surface-3)}
.conn-row .apt{width:28px;height:28px;border-radius:6px;font-size:12px}
.conn-row b{display:block;font-size:14px;font-weight:500}
.cst{font-size:12.5px;display:inline-flex;align-items:center;gap:6px;margin:0}
.cst::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.cst.ok{color:var(--ok)} .cst.warn{color:var(--high)} .cst.off{color:var(--text-3)}
.conn-main{padding:36px 44px}
.conn-top{display:flex;align-items:center;gap:16px}
.conn-top h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.02em}
.conn-top .cst{font-size:14px;margin-top:4px}
.conn-f{margin-top:30px;padding-top:28px;border-top:1px solid var(--line);max-width:900px}
.fresh button.srcdot{background:none;border:0;padding:0;font:inherit;cursor:pointer}
.fresh button.srcdot:hover{text-decoration:underline}
.ov-lower{flex:1;margin:0 -44px;padding:4px 44px 72px;background:var(--bg);border-top:1px solid var(--line)}
.ov-lower .ov-sec:first-child{margin-top:32px}
.ov-lower .plist{border-top-color:var(--line-strong)}
.ov-lower .prow{border-bottom-color:var(--line)}
.ov-lower .prow:hover{background:#fff}
.ov-head{display:flex;align-items:center}
.ov-head h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-strong)}
.sdot.critical{background:var(--crit)}.sdot.high{background:var(--high)}.sdot.medium{background:var(--med)}.sdot.low{background:var(--line-strong)}.sdot.review{background:var(--rev)}
.red{color:var(--crit)}.purple{color:var(--rev)}
.hero3{padding:12px 0 40px;border-bottom:1px solid var(--line)}
.rail-wrap{position:relative}
.car-rail{position:relative;display:flex;gap:0;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 calc(50% - 300px);outline:none;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
.car-rail::-webkit-scrollbar{display:none}
.slide{flex:0 0 600px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;padding:10px 40px;cursor:pointer;opacity:.28;transform:scale(.82);transition:opacity .3s, transform .3s}
.slide.on{opacity:1;transform:none;cursor:default}
.slide svg.veh{width:100%;max-width:640px;height:auto}
.slide .cap{text-align:center;margin-top:10px}
.slide .cap b{display:block;font-size:24px;font-weight:600;letter-spacing:-.02em}
.slide .cap span{font-size:14px;color:var(--text-3)}
.rail-arrow{position:absolute;top:42%;transform:translateY(-50%);z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--text-2)}
.rail-arrow:hover{color:var(--text);border-color:var(--line-strong)}
.rail-arrow.l{left:0}.rail-arrow.r{right:0}

.sp-h{margin:0;font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1}

.hb-next{margin:0 0 6px;font-size:15px;color:var(--text)}
.hb-next b{font-weight:600}
.hb-who{margin:0 0 22px;font-size:14px;color:var(--text-3);display:flex;align-items:center;gap:6px}
.hb-btns{display:flex;gap:10px}
.hb-btns{align-items:center}

}
.rail-tabs{display:flex;justify-content:center;gap:28px;margin-top:14px;width:380px}

.ov-sec{display:flex;align-items:center;justify-content:space-between;margin:44px 0 12px}

/* ---------- Workspace (S2, S4-S6) ---------- */
.ws{display:flex;height:calc(100vh - 136px);min-height:640px}
.queue{width:var(--queue);flex:none;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;transition:width .2s}
.queue-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}

.queue-head h3{margin:0;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:500;color:var(--text-2)}
.fchip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.qlist{overflow:auto;flex:1}

body.q-collapsed .queue{width:60px}
body.q-collapsed .queue-head .filters, body.q-collapsed .queue-head h3, body.q-collapsed .qrow .ttl, body.q-collapsed .qrow .l3, body.q-collapsed .qrow .sev, body.q-collapsed .qrow .status{display:none}
body.q-collapsed .qrow{padding:12px 6px;text-align:center}
body.q-collapsed .qrow .l1{justify-content:center}
body.q-collapsed .queue-head{padding:12px 8px}
body.q-collapsed .queue-head .row1{justify-content:center;margin:0}
body.q-collapsed .qrow .sevdot{display:inline-block}
.sevdot{display:none;width:8px;height:8px;border-radius:50%}
.sevdot.critical{background:var(--crit)}.sevdot.high{background:var(--high)}.sevdot.medium{background:var(--med)}.sevdot.low{background:var(--low)}.sevdot.review{background:var(--rev)}

.detail{flex:1;min-width:0;overflow:auto;background:var(--bg)}
.dhead{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 28px 0;position:sticky;top:0;z-index:5}
.crumbs{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-3);margin-bottom:8px}
.crumbs button{background:none;border:0;padding:0;color:var(--text-2);font-weight:500}
.crumbs button:hover{text-decoration:underline}
.dtitle{display:flex;align-items:flex-start;gap:16px}
.dtitle h1{margin:0;font-size:20px;line-height:1.3;letter-spacing:-.01em}
.dmeta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:12.5px;color:var(--text-2)}
.dmeta .sep{color:var(--line-strong)}
.deadline{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--crit)}
.deadline.unv{color:var(--rev)}
.dactions{margin-left:auto;display:flex;gap:8px;flex:none}
.flow{display:flex;gap:2px;margin-top:14px}
.flow button{border:0;background:transparent;padding:10px 14px 11px;font-size:13px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:8px}
.flow button .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;font-size:11px;font-weight:600}

.flow button.on{color:var(--text);border-bottom-color:var(--ink)}

.flow button:hover{color:var(--text)}
.dbody{padding:22px 28px 60px;max-width:1080px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:14px;font-weight:600}
.panel-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px 18px}
.answer-box{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-lg);border:1px solid var(--crit-line);background:linear-gradient(0deg,#fff,#fff) padding-box;margin-bottom:16px;position:relative;overflow:hidden}
.answer-box::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--crit)}
.answer-box .big{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--crit);line-height:1;min-width:92px}
.answer-box .big small{display:block;font-size:12px;font-weight:600;color:var(--text-3);letter-spacing:0;margin-top:4px}
.answer-box h2{margin:0 0 4px;font-size:16px}
.answer-box p{margin:0;color:var(--text-2)}
.warnline{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--rev-bg);border:1px solid var(--rev-line);color:#4A2A70;font-size:13px}

.ready-row .tx span{font-size:12px;color:var(--text-3)}
.meter{height:8px;border-radius:4px;background:var(--crit-bg);overflow:hidden;display:flex;margin-top:6px;max-width:260px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter-legend{display:flex;gap:12px;font-size:11.5px;color:var(--text-3);margin-top:4px}
.meter-legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.meter-legend .a::before{background:var(--ok)}.meter-legend .b::before{background:var(--crit-bg);border:1px solid var(--crit-line)}

/* timeline */
.tl{position:relative;height:150px;margin:6px 8px 0}
.tl-track{position:absolute;left:0;right:0;top:74px;height:6px;border-radius:3px;background:var(--surface-3)}
.tl-gap{position:absolute;top:70px;height:14px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--crit-bg) 0 6px,#F8D3D6 6px 12px);border:1px solid var(--crit-line)}
.tl-gap span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:600;color:var(--crit);white-space:nowrap}
.tl-window{position:absolute;top:70px;height:14px;background:rgba(106,60,158,.12);border:1px dashed var(--rev);border-radius:3px}
.tl-m{position:absolute;top:0;bottom:0;width:0}
.tl-m .stem{position:absolute;left:-1px;width:2px;background:var(--text)}
.tl-m .pin{position:absolute;left:-7px;top:70px;width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
.tl-m .lab{position:absolute;white-space:nowrap;font-size:12px;line-height:1.3}
.tl-m .lab b{display:block;font-size:12.5px}
.tl-m .lab span{color:var(--text-3)}
.tl-m.top .stem{top:40px;height:32px}.tl-m.top .lab{top:0}
.tl-m.bottom .stem{top:84px;height:24px}.tl-m.bottom .lab{top:110px}
.tl-m.alignR .lab{right:6px;text-align:right}.tl-m.alignL .lab{left:6px}.tl-m.alignC .lab{left:0;transform:translateX(-50%);text-align:center}
.tl-m.k-now .pin{background:var(--text)} .tl-m.k-now .stem{background:var(--text)}
.tl-m.k-respond .pin{background:var(--rev)} .tl-m.k-respond .stem{background:var(--rev)} .tl-m.k-respond b{color:var(--rev)}
.tl-m.k-need .pin{background:var(--crit)} .tl-m.k-need .stem{background:var(--crit)} .tl-m.k-need b{color:var(--crit)}
.tl-m.k-eta .pin{background:var(--med)} .tl-m.k-eta .stem{background:var(--med)} .tl-m.k-eta b{color:var(--med)}
.tl-m.k-eta2 .pin{background:#fff;box-shadow:0 0 0 2px var(--med)} .tl-m.k-eta2 .stem{background:var(--med);opacity:.6} .tl-m.k-eta2 b{color:var(--med)}
.tl-m.k-old .pin{background:var(--line-strong)} .tl-m.k-old .stem{background:var(--line-strong)} .tl-m.k-old b{color:var(--text-3);text-decoration:line-through}
.tl-ticks{position:absolute;left:0;right:0;top:92px;height:10px}
.tl-days{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);border-top:1px solid var(--line);padding-top:6px;margin:4px 8px 0}
.tl-note{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--text-2)}

/* evidence list */
.ev{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .sys{width:34px;height:34px;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--text-2);flex:none;letter-spacing:.02em}
.ev .tx{flex:1;min-width:0}
.ev .tx b{font-size:13px}
.ev .tx .ex{font-size:12.5px;color:var(--text-2);margin-top:3px}
.ev .tx .mt{font-size:11.5px;color:var(--text-3);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ev.hl{background:#FFFBEA;margin:0 -12px;padding:12px;border-radius:var(--r);box-shadow:inset 0 0 0 1px #F0DD8C}
.fresh-b{display:inline-flex;align-items:center;gap:4px;font-weight:500}
.fresh-b::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.fresh-b.stale{color:var(--high)}.fresh-b.stale::before{background:var(--high)}
.conflict{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:8px}
.conflict .side{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff}
.conflict .side .v{font-size:15px;font-weight:600;margin:2px 0}
.conflict .vs{display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-3)}

.optmini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.stepper{display:flex;align-items:flex-start;gap:0;margin:4px 0 6px}

.state-card .l{font-size:11.5px;color:var(--text-3);font-weight:600;letter-spacing:.04em;text-transform:uppercase}

// scroll position that puts a slide at the start of the rail
const railPos = (rail, el) => el.offsetLeft - parseFloat(getComputedStyle(rail).paddingLeft);
function initRail(){
  const rail = document.getElementById('carRail'); if(!rail) return;
  const slides = [...rail.querySelectorAll('.slide')];
  const center = el => railPos(rail, el);
  const cur = slides.find(x=>x.dataset.slide===S.spot) || slides[0];
  rail.scrollLeft = center(cur);
  let t;
  rail.onscroll = () => { clearTimeout(t); t = setTimeout(()=>{
    const near = slides.reduce((a,b)=>Math.abs(railPos(rail,b)-rail.scrollLeft) < Math.abs(railPos(rail,a)-rail.scrollLeft) ? b : a);
    setSpot(near.dataset.slide, false);
  }, 80); };
  rail.onkeydown = e => { if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); step(e.key==='ArrowRight'?1:-1); } };
}
function setSpot(id, scroll){
  const rail = document.getElementById('carRail');
  if(scroll && rail){ const el = rail.querySelector(`[data-slide="${id}"]`); rail.scrollTo({left: railPos(rail, el), behavior:'instant'}); }
  if(S.spot===id) return;
  S.spot = id;
  document.querySelectorAll('.slide').forEach(x=>x.classList.toggle('on', x.dataset.slide===id));
  document.querySelectorAll('.rail-tabs button').forEach(x=>x.setAttribute('aria-selected', x.dataset.spot===id));
  const body = document.getElementById('spotBody');
  body.classList.remove('fade'); void body.offsetWidth; body.innerHTML = spotBody(MODELS.find(m=>m.id===id)); body.classList.add('fade');
}
function step(d){ const ids = MINE().map(m=>m.id); const i = Math.max(0, Math.min(ids.length-1, ids.indexOf(S.spot)+d)); setSpot(ids[i], true); }

  return `<div class="ws">

            <button class="btn" data-open-ai="${r.id}">${I.spark}<span>Ask AI</span></button>
          </div>
        </div>
        <nav class="flow" aria-label="Response flow">${flowSteps.map(([k,l],i)=>`<button class="${rt.view===k?'on':''} ${i<doneIdx&&rt.view!==k&&i>0?'done':''} ${i===0&&rt.view!=='detail'?'done':''}" data-go="risk/${r.id}${k==='detail'?'':'/'+k}" ${rt.view===k?'aria-current="step"':''}><span class="n">${(i<doneIdx&&rt.view!==k)?I.chk:i+1}</span>${l}</button>`).join('')}</nav>

    <div class="tl-track"></div>
    ${opt.window?`<div class="tl-window" style="left:${opt.window[0]}%;width:${opt.window[1]-opt.window[0]}%" title="Preparation window (assumed 4 h)"></div>`:''}
    ${opt.gap?`<div class="tl-gap" style="left:${opt.gap[0]}%;width:${opt.gap[1]-opt.gap[0]}%"><span>${opt.gap[2]}</span></div>`:''}
    ${ms.map(m=>`<div class="tl-m k-${m.k} ${m.pos} ${m.al}" style="left:${m.p}%"><div class="stem"></div><div class="pin"></div><div class="lab"><b>${m.b}</b><span class="num">${m.s}</span></div></div>`).join('')}
  </div><div class="tl-days">${days.map(d=>`<span>${d}</span>`).join('')}</div>`;
}
function evRow(id){const e=EVIDENCE[id], a=EV_APP[e.sys], x=EV_MORE[id]||{}; if(!a) return '';
  const A=APPS[a];
  return `<div class="evc ${S.hlEv===id?'hl':''}" id="ev-${id}">
    <div class="evc-h">${appTile(a)}<b>${A.short}: ${x.label||e.sys}</b><span class="fresh-b ${e.fresh?'':'stale'}">${e.fresh?'Fresh':'Stale'}</span></div>
    <dl class="evc-f">
      <dt>What it is</dt><dd>${x.what||e.sysName}</dd>
      <dt>From</dt><dd>${A.name}: ${e.rec}</dd>
      <dt>Updated</dt><dd>${e.t} ET</dd>
      <dt>Used for</dt><dd>${x.use||''}</dd>
    </dl>
    ${A.link?`<button class="evc-open" data-toast="Opens record ${e.rec} in ${A.name} (simulated)">Open record in ${A.short} ↗</button>`:`<p class="evc-find">No direct link. Search <b>${e.rec.split(' · ')[0]}</b> in ${A.name}.</p>`}

function calcCard(rid){ const c=CALC[rid]; if(!c) return '';
  return `<div class="calc2"><div class="calc2-h">Calculation</div>${c.map(([k,v,ev])=>`<div class="calc2-r ${k==='Short'?'tot':''} ${k==='Needed'?'sub':''}"><span>${k}</span>${ev?`<button class="calc2-s" data-ev="${ev}" data-ctx="${rid}">${appTile(EV_APP[EVIDENCE[ev].sys],'sm')}${APPS[EV_APP[EVIDENCE[ev].sys]].short}</button>`:'<span></span>'}<b class="num">${v}</b></div>`).join('')}
    <p class="calc2-n">Combined from 3 sources by Nexxa. Not a number reported by one system.</p></div>`;}

    S.share[r.id] = {channel:'teams', to:def, status:'draft', note:'', attempts:0, shareId:'SH-0'+(190+RISKS.indexOf(r))};
  }
  return S.share[r.id];
}

        <div class="field"><span class="fl">1 · Channel</span><div class="seg" role="group" aria-label="Channel">
          <button data-ch="teams" aria-pressed="${sh.channel==='teams'}" ${sentLock?'disabled':''}><b>Teams message</b><span>Fast · for same-day</span></button>

        </div>${hasExt?`<div class="warnline amber" style="margin-top:8px;font-size:12px">${I.lock}<span>External recipient: internal ERP/plan excerpts and evidence links are <b>removed</b> for them. They’ll get the request and deadline only.</span></div>`:''}
        ${sh.to.length===0?`<div class="errtx">${I.info} Pick at least one recipient</div>`:''}</div>
        ${o?`<div class="field" style="margin:0"><span class="fl">Selected option</span><div style="font-size:13px">${o.name} <button class="link" data-go="risk/${r.id}/compare" style="font-size:12px">Change</button></div></div>`:''}

      ${sh.status!=='sent'?`<div class="send-bar"><span class="muted" style="font-size:12px">Draft auto-saved · leaving keeps it</span>
        <button class="btn btn-ghost btn-sm" data-go="risk/${r.id}">Cancel</button>
        <button class="btn btn-primary" id="sendBtn" ${sending||sh.to.length===0?'disabled':''}>${sending?'<span class="spinner"></span>Sending…':I.share+'Send request'}</button></div>`:''}

  const sh = S.share[r.id];
  const o = (OPTIONS[r.id]||[]).find(x=>x.id===S.opt[r.id]);
  const t = S.task[r.id] ||= {owner:'', due:'2026-10-05T09:00', created:false, errors:{}, stage:0};
  const acts = S.activity[r.id]||[];
  const stages = ['Verification requested','Pending approval','Approved','In progress','Complete'];
  return `
  <div class="state-pair">
    <div class="state-card"><div class="l">Share</div><div class="v">${sh?.status==='sent'?'<span class="status ok">Sent</span>':sh?.status==='failed'?'<span class="status fail">Failed</span>':'<span class="status muted">Not sent</span>'}</div><p>${sh?.status==='sent'?'Delivered to recipients. This alone does not resolve the risk.':'<button class="link" data-go="risk/'+r.id+'/share">Send a verification request</button> first, or assign a task directly.'}</p></div>

      <div class="field"><label for="tTitle">Task</label><input class="input" id="tTitle" value="${r.id==='R1'?(o?.id==='xfer'?'Verify Lexington kits: rev C0, QA release, transit':o?.id==='reseq'?'Confirm Tue volume and move 12 units to Tue PM':'Confirm expedite of 12 seat kits + freight quote'):r.id==='R2'?'Confirm #4832 arrival with carrier':'Ops review: Body Weld #2 restart'}"></div>

        <div class="field"><label for="tOwner">Owner <span style="color:var(--crit)">*</span></label>
          <select class="input ${t.errors.owner?'err':''}" id="tOwner" aria-invalid="${!!t.errors.owner}"><option value="">Choose an owner…</option>${PEOPLE.filter(p=>!p.ext).map(p=>`<option value="${p.id}" ${t.owner===p.id?'selected':''}>${p.name} · ${p.role}</option>`).join('')}</select>
          ${t.errors.owner?`<div class="errtx">${I.info} Owner is required</div>`:''}</div>

          <input type="datetime-local" class="input ${t.errors.due?'err':''}" id="tDue" value="${t.due}" aria-invalid="${!!t.errors.due}">
          ${t.errors.due?`<div class="errtx">${I.info} ${t.errors.due}</div>`:`<div class="hint">Must be before respond-by (${r.respond})</div>`}</div>
      </div>
      <div class="field" style="margin-bottom:6px"><span class="fl">Approval path</span>
        <div class="appr">${approvalPath(r,o).map((a,i)=>`<div class="appr-row"><span class="n">${i+1}</span><div class="tx">${a[0]}<span>${a[1]}</span></div><span class="status muted">${a[2]}</span></div>`).join('')}</div>
      </div>
      <div class="warnline" style="margin:12px 0 0;font-size:12.5px">${I.info}<span>Nexxa won’t buy, spend, or change the schedule. Those go through existing approvals. Data is rechecked before anything is executed.</span></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn btn-primary" id="createTask">Create task</button></div>
    </div></div>`
  :`
  <div class="panel"><div class="panel-h"><h3>TSK-4471 · ${document.getElementById('tTitle')?.value||t.title}</h3><div class="right"><span class="status action">In progress</span></div></div>
    <div class="panel-b">
      <div class="stepper">${stages.map((s,i)=>`<div class="step ${i<t.stage?'done':i===t.stage?'cur':''}"><div class="c">${i<t.stage?I.chk:i+1}</div>${s}</div>`).join('')}</div>
      <div class="divider"></div>
      <div style="display:flex;gap:24px;font-size:13px;flex-wrap:wrap">
        <div><span class="muted">Owner</span><br><b>${PEOPLE.find(p=>p.id===t.owner).name}</b></div>
        <div><span class="muted">Due</span><br><b class="num">${fmtDue(t.due)}</b></div>
        <div><span class="muted">Follow-up</span><br><b>Nudge at 8:00 AM Mon if no reply</b></div>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end">
          <button class="btn btn-sm" id="advance" ${t.stage>=3?'disabled':''}>Simulate next update</button>
          <button class="btn btn-sm" disabled title="Available after recalculation shows 0 gap">Mark resolved</button>
        </div>
      </div>
      ${t.stage>=3?`<div class="warnline green" style="margin-top:14px">${I.chk}<span>Owner reports kits in transit. When the receipt posts in ERP, Nexxa recalculates. If the gap is 0, R1 moves to <b>Resolved</b>. Then share lessons with other plants (yokoten).</span></div>`:''}
    </div></div>`}

  <div class="panel"><div class="panel-h"><h3>Activity</h3><span class="muted" style="font-size:12px">State, owner, time and reason are recorded</span></div>

}
function approvalPath(r,o){
  if(r.id!=='R1') return [['Verification by owner','Confirms facts','Not started']];
  if(o?.id==='reseq') return [['Production Control · Priya Nair','Confirms Tuesday volume','Not started'],['Production Planning GM','Schedule change approval','Not started'],['Sales · fleet desk','Accepts Tuesday delivery','Not started']];
  if(o?.id==='xfer') return [['Supplier QA · Tom Walsh','Revision + quality release','Not started'],['Production Control Manager','Transfer approval','Not started']];
  return [['Logistics · Aiko Tanaka','Confirms ship date with supplier','Not started'],['Purchasing Manager','Freight spend approval (quote required)','Not started']];
}
function fmtDue(v){const d=new Date(v);if(isNaN(d))return v;return d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}

/* =========================================================
   S3 · AI + Evidence drawer
   ========================================================= */
function vDrawer(){
  const d = document.getElementById('drawer');
  const open = !!S.drawer;
  document.body.classList.toggle('drawer-open',open);
  d.setAttribute('aria-hidden',!open);
  if(!open){d.innerHTML='';return;}
  const ctx = S.ctx; const A = AI[ctx] || {ctx:ctx+' · '+(byId(ctx)?.short||''),qs:[]};
  const chat = S.chats[ctx] || [];
  const evIds = ctx==='overview' ? [] : (byId(ctx)?.ev||[]);
  d.innerHTML = `
    <div class="drawer-h"><div class="r1"><h2><span class="spark">${I.spark}</span>Nexxa AI</h2><button class="icon-btn" id="closeDrawer" aria-label="Close panel (Esc)" style="margin-left:auto">${I.x}</button></div>
      <div class="dtabs" role="tablist"><button role="tab" data-tab="ai" aria-selected="${S.tab==='ai'}">Ask</button><button role="tab" data-tab="ev" aria-selected="${S.tab==='ev'}">Evidence${evIds.length?` · ${evIds.length}`:''}</button></div></div>
    <div class="ctx"><span class="pin">${I.pin}</span><span>Pinned context:</span><b>${A.ctx}</b></div>
    ${S.prevCtx&&S.prevCtx!==ctx?`<div class="ctx-banner">${I.info}<span>Context changed <b>${S.prevCtx==='overview'?'Overview':S.prevCtx}</b> → <b>${ctx==='overview'?'Overview':ctx}</b>. Answers below use ${ctx==='overview'?'the overview':ctx} only; the ${S.prevCtx} thread is kept separately.</span></div>`:''}
    <div class="drawer-b" id="drawerBody">
      ${S.tab==='ai'?aiBody(ctx,A,chat):`${calcCard(ctx)}${evIds.length?evIds.map(evRow).join(''):'<p class="muted">Select a risk to see its sources.</p>'}`}
    </div>
    ${S.tab==='ai'?`<div class="drawer-f"><form class="composer" id="aiForm"><textarea id="aiInput" rows="1" placeholder="Ask about ${ctx==='overview'?'this week':ctx}…" aria-label="Ask Nexxa AI">${S.failedQ||''}</textarea><button class="btn btn-primary btn-sm" type="submit" aria-label="Send">${I.arrow}</button></form>
      <div class="disclaim">Numbers come from ERP/plan calculations. AI explains them and can be wrong. Check sources.</div></div>`:''}`;
}
function aiBody(ctx,A,chat){
  let h = '';
  if(!chat.length) h += `<p style="margin:0 0 6px;font-size:13px;color:var(--text-2)">Suggested questions${ctx!=='overview'?' about '+ctx:''}</p>`;
  chat.forEach(m=>{
    h += `<div class="msg-u">${m.q}</div>`;
    if(m.err) h += `<div class="msg-a" style="border-color:var(--crit-line);background:var(--crit-bg)"><b>Nexxa AI couldn’t answer.</b><p style="margin:4px 0 0;font-size:12.5px">Your question is kept in the box below. You can retry or check the sources directly.</p><div class="acts"><button class="btn btn-sm" id="aiRetry">${I.retry}Retry</button><button class="btn btn-sm" data-tab="ev">Open sources</button></div></div>`;
    else if(m.a) h += answer(m.a, ctx, m.open);
  });
  if(S.pending===ctx) h += `<div class="thinking"><i></i><i></i><i></i> Checking ${ctx==='overview'?'all risks':ctx+' sources'}…</div>`;
  const asked = new Set(chat.map(m=>m.q));
  const rest = A.qs.map((q,i)=>[q,i]).filter(([q])=>!asked.has(q.q));
  if(rest.length) h += `<div class="sugg">${chat.length?'<p class="tag" style="margin:14px 0 2px">Follow-up</p>':''}${rest.map(([q,i])=>`<button data-ask="${ctx}:${i}">${q.q}${I.chev}</button>`).join('')}</div>`;
  return h;
}
function answer(a,ctx,openR){
  return `<div class="msg-a">
    ${a.kinds?`<div class="kinds">${a.kinds.map(k=>`<span class="kind ${k}">${k==='fact'?'Observed':k==='calc'?'Calculated':'Estimate'}</span>`).join('')}</div>`:''}
    <h5>Conclusion</h5><p class="concl">${a.concl}</p>
    <h5>Evidence</h5><ul>${a.ev.map(e=>`<li>${e}</li>`).join('')}</ul>
    <h5>Assumptions & unknowns</h5><ul>${a.unk.map(e=>`<li>${e}</li>`).join('')}</ul>
    <h5>Next action</h5><p>${a.next}</p>
    <div class="acts">${openR?`<button class="btn btn-sm btn-primary" data-risk="${openR}">Open ${openR}</button>`:''}
      ${ctx!=='overview'?`<button class="btn btn-sm" data-go="risk/${ctx}/share">Use in request</button><button class="btn btn-sm" data-go="risk/${ctx}/compare">Compare options</button>`:''}
      <button class="btn btn-sm btn-ghost" data-toast="Marked as not helpful. Recommendation dismissed">Reject</button></div>
  </div>`;
}
function openDrawer(ctx,tab){
  if(S.ctx && S.ctx!==ctx) S.prevCtx=S.ctx; else if(!S.drawer) S.prevCtx=null;
  S.ctx=ctx; S.drawer=true; S.tab=tab||'ai'; S.failedQ=null;
  render(); setTimeout(()=>document.getElementById('closeDrawer')?.focus(),50);
}
function ask(ctx,idx,text){
  const A=AI[ctx]; const q = text || A.qs[idx].q;
  (S.chats[ctx] ||= []).push({q, a:null});
  S.pending=ctx; S.failedQ=null; render(); scrollDrawer();
  setTimeout(()=>{
    const m = S.chats[ctx][S.chats[ctx].length-1];
    if(demo.aiFail){ m.err=true; S.failedQ=q; }
    else if(idx!=null){ m.a=A.qs[idx].a; m.open=A.qs[idx].open; }
    else m.a={concl:`In this prototype, Nexxa answers the suggested questions. Your question stays in ${ctx==='overview'?'the overview':ctx} context.`,ev:['No sources used'],unk:['Free-text answers are not simulated.'],next:'Try a suggested question below.'};
    S.pending=null; render(); scrollDrawer();
  }, 900);
}
function scrollDrawer(){const b=document.getElementById('drawerBody'); if(b) b.scrollTop=b.scrollHeight;}

/* =========================================================
   Render + events
   ========================================================= */
let lastView='';
function render(){
  const rt = route();
  const main = document.getElementById('main');
  const qs = document.getElementById('qlist')?.scrollTop;
  if(qs!=null) S.queueScroll = qs;
  // queue auto-collapses when the drawer is open or on wide screens (S4/S5), unless user chose
  const auto = !!S.drawer || rt.view==='compare' || rt.view==='share';
  document.body.classList.toggle('q-collapsed', rt.view!=='overview' && (S.qCollapsedManual ?? auto));
  document.body.classList.toggle('ov', rt.view==='overview'||rt.view==='connections');
  main.innerHTML = rt.view==='overview' ? vOverview() : rt.view==='connections' ? vConnections(rt.app) : vWorkspace(rt);
  const ql = document.getElementById('qlist'); if(ql) ql.scrollTop = S.queueScroll;
  initRail();
  const key = rt.view+(rt.risk||'');
  if(key!==lastView){ document.getElementById('detail')?.scrollTo(0,0); window.scrollTo(0,0); lastView=key; }
  document.querySelectorAll('.rail button[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===(rt.view==='connections'?'connections':'overview')));
  // keep AI context in sync with the risk on screen (F4)
  if(S.drawer && rt.risk && byId(rt.risk).ev && S.ctx!==rt.risk){ S.prevCtx=S.ctx; S.ctx=rt.risk; S.failedQ=null; }
  vDrawer();
  renderScope();
}

document.addEventListener('click', e=>{
  const pt = e.target.closest('[data-pop],[data-pick-plant],[data-pick-plan],[data-pick-win],[data-lines-all],[data-lines-none],#refreshAll');
  if(pt){ const d=pt.dataset, sc=scopeState();
    if(d.pop){ S.pop = S.pop===d.pop?null:d.pop; renderScope(); return; }
    if(d.pickPlant){ S.pop=null; renderScope(); return; }
    if(d.pickPlan){ sc.plan=+d.pickPlan; S.pop=null; render(); return; }
    if(d.pickWin){ sc.win=d.pickWin; S.pop=null; render(); return; }
    if('linesAll' in d){ sc.lines=LINES.map(l=>l.id); render(); return; }
    if('linesNone' in d){ sc.lines=[]; render(); return; }
    if(pt.id==='refreshAll'){ S.mesFixed=true; toast('All sources refreshed. MES updated 8:41 AM (simulated)'); renderScope(); return; }
  }
  if(S.pop && !e.target.closest('#spop')){ S.pop=null; renderScope(); }
  const sl = e.target.closest('.slide'); if(sl){ setSpot(sl.dataset.slide, true); return; }
  const t = e.target.closest('button,[data-risk],tr.row'); if(!t) return;
  const ds = t.dataset;
  if(ds.ev && !t.closest('.ev')){ // citation / source chip
    const rt=route(); const ctx = ds.ctx || rt.risk || (Object.keys(AI).find(k=>AI[k].qs?.length&&byId(k)?.ev?.includes(ds.ev))) || 'R1';
    S.hlEv = ds.ev;
    if(!S.drawer||S.ctx!==ctx) openDrawer(ctx==='overview'?'R1':ctx,'ev'); else {S.tab='ev'; render();}
    setTimeout(()=>document.getElementById('ev-'+ds.ev)?.scrollIntoView({block:'center',behavior:'smooth'}),80);
    return;
  }
  if(ds.risk){ // open risk; preserve current sub-view if in workspace
    go('risk/'+ds.risk); return;
  }
  if(ds.go){ go(ds.go); return; }
  if(ds.openAi){ openDrawer(ds.openAi,'ai'); return; }
  if(ds.openEv){ S.hlEv=null; openDrawer(ds.openEv,'ev'); return; }
  if(ds.ask){ const [c,i]=ds.ask.split(':'); if(!S.drawer||S.ctx!==c) openDrawer(c,'ai'); ask(c,+i); return; }
  if(ds.tab){ S.tab=ds.tab; render(); return; }
  if(ds.filter){ S.filter=ds.filter; S.queueScroll=0; render(); return; }
  if(ds.pick){ const r=route().risk; S.opt[r]=ds.pick; if(S.share[r]?.status!=='sent') delete S.share[r]; render(); return; }
  if(ds.ch){ S.share[route().risk].channel=ds.ch; render(); return; }
  if(ds.person){ const sh=S.share[route().risk]; sh.to = sh.to.includes(ds.person)? sh.to.filter(x=>x!==ds.person): [...sh.to, ds.person]; render(); return; }
  if(ds.toast){ toast(ds.toast); return; }
  if(ds.spot){ setSpot(ds.spot, true); return; }
  if(ds.model){ S.model = S.model===ds.model?null:ds.model; render(); document.getElementById('pq')?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  switch(t.id){
    case 'closeDrawer': S.drawer=null; S.prevCtx=null; render(); return;
    case 'qToggle': S.qCollapsedManual = !document.body.classList.contains('q-collapsed'); render(); return;
    case 'showAll': S.showAll=true; render(); return;
    case 'clearModel': S.model=null; render(); return;
    case 'railPrev': step(-1); return;
    case 'railNext': step(1); return;
    case 'showLess': S.showAll=false; render(); return;
    case 'toShare': go('risk/'+route().risk+'/share'); return;
    case 'sendBtn': case 'retrySend': doSend(); return;
    case 'createTask': createTask(); return;
    case 'advance': { const tk=S.task[route().risk]; tk.stage=Math.min(3,tk.stage+1); const lbl=['','Pending approval','Approved','In progress'][tk.stage]; log(route().risk,{i:'blue',t:`Task: ${lbl}`,s:`${PEOPLE.find(p=>p.id===tk.owner).name} · simulated`}); render(); return; }
    case 'aiRetry': { const c=S.ctx; const chat=S.chats[c]; const last=chat.pop(); const idx=AI[c]?.qs.findIndex(q=>q.q===last.q); demo.aiFail=false; document.getElementById('dAiFail').checked=false; ask(c, idx>=0?idx:null, last.q); return; }
    case 'refreshBtn': case 'refreshMes': S.mesFixed=true; toast('All sources refreshed. MES updated 8:41 AM (simulated)'); renderScope(); return;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.pop){ const k=S.pop; S.pop=null; renderScope(); document.querySelector(`[data-pop="${k}"]`)?.focus(); return; }
  if(e.key==='Escape' && S.drawer){ S.drawer=null; S.prevCtx=null; render(); return; }
  if(e.key==='Enter' && e.target.matches('.p2row')){ go('risk/'+e.target.dataset.risk); return; }
  if(e.key==='Enter' && e.target.matches('tr.row')){ go('risk/'+e.target.dataset.risk); }
  if(e.key==='/' && !e.target.matches('input,textarea,[contenteditable]')){ e.preventDefault(); document.querySelector('.search input').focus(); }
  if(e.key==='Enter' && !e.shiftKey && e.target.id==='aiInput'){ e.preventDefault(); document.getElementById('aiForm').requestSubmit(); }
});
document.addEventListener('submit', e=>{
  if(e.target.id!=='aiForm') return; e.preventDefault();
  const v = document.getElementById('aiInput').value.trim(); if(!v) return;
  const A=AI[S.ctx]; const idx = A?.qs.findIndex(q=>q.q.toLowerCase().includes(v.toLowerCase().slice(0,12)));
  ask(S.ctx, idx>=0?idx:null, v);
});
document.addEventListener('change', e=>{
  const id=e.target.dataset?.pickLine; if(!id) return; const sc=scopeState();
  sc.lines = e.target.checked ? [...new Set([...sc.lines,id])] : sc.lines.filter(x=>x!==id);
  render();
});
document.addEventListener('input', e=>{
  if(e.target.matches('.editable')){ S.share[route().risk].req=e.target.innerHTML; }
  if(e.target.id==='shNote'){ S.share[route().risk].note=e.target.value; }
  if(e.target.id==='tOwner'||e.target.id==='tDue'){ const tk=S.task[route().risk]; tk.owner=document.getElementById('tOwner').value; tk.due=document.getElementById('tDue').value; }
});
function doSend(){
  const r=route().risk; const sh=S.share[r];
  if(sh.status==='sending'||sh.status==='sent') return; // no duplicate sends
  sh.status='sending'; sh.attempts++; render();
  setTimeout(()=>{
    const who = sh.to.map(id=>PEOPLE.find(p=>p.id===id).name).join(', ');
    if(demo.sendFail && !sh.fails){ sh.status='failed'; sh.fails=1; log(r,{i:'fail',t:'Send failed (timeout), draft kept',s:`${sh.shareId} · attempt 1`}); }
    else { sh.status='sent'; log(r,{i:'ok',t:`Share sent via ${sh.channel==='teams'?'Teams':'email'} to ${who}`,s:`${sh.shareId} · attempt ${sh.attempts} · Fri Oct 2, 8:52 AM`}); }
    render();
  }, 1100);
}
function createTask(){
  const r=route().risk; const tk=S.task[r];
  tk.owner=document.getElementById('tOwner').value; tk.due=document.getElementById('tDue').value; tk.title=document.getElementById('tTitle').value;
  tk.errors={};
  if(!tk.owner) tk.errors.owner=true;
  if(!tk.due) tk.errors.due='Due date is required';
  else if(r==='R1' && new Date(tk.due) > new Date('2026-10-05T10:00')) tk.errors.due='Must be before Mon Oct 5, 10:00 AM';
  if(Object.keys(tk.errors).length){ render(); document.querySelector('.err')?.focus(); return; }
  if(tk.created) return; // no duplicate tasks
  tk.created=true; tk.stage=0; S.riskStatus[r]='In progress';
  const own=PEOPLE.find(p=>p.id===tk.owner).name;
  log(r,{i:'blue',t:`Task TSK-4471 created · owner ${own}`,s:`Due ${fmtDue(tk.due)} · Fri Oct 2, 8:55 AM`});
  log(r,{i:'blue',t:'Status: Needs review → In progress',s:'Jordan Reyes · 8:55 AM'}); render(); toast('Task TSK-4471 created (simulated)');
}

/* demo controls */
document.getElementById('demoBtn').onclick=()=>{const d=document.getElementById('demo');d.classList.toggle('open');document.getElementById('demoBtn').setAttribute('aria-expanded',d.classList.contains('open'));};
document.getElementById('dSendFail').onchange=e=>demo.sendFail=e.target.checked;
document.getElementById('dAiFail').onchange=e=>demo.aiFail=e.target.checked;
document.getElementById('dLoading').onchange=e=>{demo.loading=e.target.checked;S.loaded=false;go('overview');render();};
document.getElementById('dReset').onclick=()=>{S=initial();Object.assign(demo,{sendFail:false,aiFail:false,loading:false});['dSendFail','dAiFail','dLoading'].forEach(i=>document.getElementById(i).checked=false);go('overview');render();toast('Prototype reset');};

render();
</script>
